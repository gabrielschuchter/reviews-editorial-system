name: Strict editorial style

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  strict-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run strict style regression tests
        run: python -m unittest tests.test_strict_style -v

      - name: Run repository checks
        run: python scripts/run_checks.py
