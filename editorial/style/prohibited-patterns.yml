schema_version: "1.0.0"
config_version: "1.0.0"
config_status: canonical
language: pt-BR
governance:
  canonical: true
  operational_use: mandatory
  approval_status: approved-by-editorial-authority
  approval_authority: human-editor
  created_on: "2026-07-22"
  updated_on: "2026-08-06"
  corpus_preferences_applied: true
  source_basis:
    document: "Proibições rígidas de estilo"
    rules:
      - "REV-STYLE-HARD-001"
      - "REV-STYLE-HARD-002"
    descriptive_reference: "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing"

enforcement:
  automatic_authorship_inference: false
  detector_is_authority: false
  contextual_human_review_required: true
  hard_rules_are_automatic_failure: true
  hard_rules_allow_false_positive_disposition: false
  rule: "Antítese e traços em texto corrido bloqueiam a edição. Outros sinais permanecem sujeitos a revisão contextual."

rules:
  - id: antithesis
    policy_id: REV-STYLE-HARD-001
    kind: hard-prohibition
    description: "Antítese, oposição corretiva, contraste adversativo ou concessivo e qualquer construção equivalente."
    severity: critical
    action: rewrite-as-direct-independent-statements
    examples:
      - "não é X, mas Y"
      - "não é X, e sim Y"
      - "não apenas X, mas também Y"
      - "não se resume a X. Inclui Y"
    markers:
      - "mas"
      - "porém"
      - "contudo"
      - "entretanto"
      - "todavia"
      - "no entanto"
      - "ainda assim"
      - "por outro lado"
      - "ao contrário"
      - "em contrapartida"
      - "em vez de"
      - "embora"
      - "apesar de"
      - "ainda que"
      - "mesmo que"
      - "mesmo sem"
    allowed_negative_scope: "Negativa clínica direta que não prepara oposição, como contraindicação, ausência de estudo ou resultado negativo."

  - id: dash-in-running-text
    policy_id: REV-STYLE-HARD-002
    kind: hard-prohibition
    description: "Hífen, meia risca, travessão, sinal de menos ou traço equivalente em texto corrido."
    severity: critical
    action: rewrite-with-simple-punctuation-or-words
    characters:
      - "-"
      - "–"
      - "—"
      - "−"
    narrow_exception: "Elemento exclusivamente organizacional, identificador técnico, endereço eletrônico, DOI ou URL."

  - id: fabricated-detail
    kind: hard-prohibition
    description: "Detalhe, número, mecanismo, referência ou atribuição criado para dar fluidez ou autoridade."
    severity: critical
    action: block-and-run-factual-audit

  - id: unsupported-citation
    kind: hard-prohibition
    description: "Citação existente que não sustenta a afirmação à qual foi ligada."
    severity: critical
    action: block-and-correct-claim-ledger

  - id: chatbot-artifact
    kind: hard-prohibition
    description: "Metacomentário, marcador interno, instrução ao operador ou fragmento de resposta de chatbot no texto editorial."
    severity: critical
    action: remove-and-review-context

  - id: generic-opening
    kind: contextual-review
    description: "Abertura ampla que não delimita pergunta, tensão clínica ou evidência."
    severity: review
    action: rewrite-around-editorial-function

  - id: formulaic-conclusion
    kind: contextual-review
    description: "Conclusão que recapitula fórmulas sem comunicar o bottom line e sua certeza."
    severity: error
    action: rebuild-from-bottom-line

  - id: excessive-headings-or-lists
    kind: contextual-review
    description: "Títulos ou listas usados para simular hierarquia em vez de desenvolver raciocínio."
    severity: review
    action: consolidate-by-function

  - id: artificial-rule-of-three
    kind: contextual-review
    description: "Tríade, paralelismo ou frase excessivamente simétrica imposta ao conteúdo."
    severity: review
    action: preserve-only-natural-structure

  - id: mechanical-connectors
    kind: contextual-review
    phrases:
      - "além disso"
      - "nesse contexto"
      - "é importante destacar"
      - "vale ressaltar"
      - "de maneira geral"
      - "em suma"
      - "em conclusão"
    description: "Repetição ou ausência de função exige revisão."
    severity: review
    action: verify-logical-function

  - id: promotional-or-grandiose-tone
    kind: contextual-review
    description: "Adjetivo vago, promessa, grandiosidade ou metáfora sem função clínica e suporte."
    severity: error
    action: replace-with-specific-supported-meaning

  - id: empty-transition
    kind: contextual-review
    description: "Transição que apenas anuncia, resume ou recapitula sem avançar a análise."
    severity: error
    action: connect-content-relations

  - id: repeated-question
    kind: contextual-review
    description: "Repetição mecânica da pergunta antes de oferecer a resposta."
    severity: review
    action: answer-or-advance

  - id: generic-limitations
    kind: contextual-review
    description: "Lista de limitações sem localização, mecanismo, direção possível e efeito na conclusão."
    severity: error
    action: apply-specific-critique-contract

  - id: unapproved-corpus-vocabulary
    kind: governance-prohibition
    description: "Vocabulário tratado como típico do Reviews sem curadoria, proveniência e aprovação humana."
    severity: critical
    action: revert-to-neutral-native-portuguese

candidate_gate:
  require_all_critical_resolved: true
  require_strict_style_report: true
  require_strict_style_passed: true
  detector_score_threshold: null
  unresolved_contextual_flags_require-disposition: true
