[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviews-editorial-system"
version = "0.2.0"
description = "Pipeline editorial auditável e Codex-native para o Reviews"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
documents = ["python-docx>=1.1,<2", "pypdf>=5,<7"]
test = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
